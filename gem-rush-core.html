<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gem Rush — Free Puzzle Game | CyberNovaWorks</title>
<meta name="description" content="Play Gem Rush free: a colourful match-3 gem puzzle with special gems, combos and levels.">
<style>
:root{--bg:#0b0820;--tx:#f2eeff;--mut:#9a92c9;--ac:#ffd34d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(circle at 20% 0,#2a1760,var(--bg) 60%);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;padding:14px 12px;overflow-x:hidden;user-select:none;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;touch-action:manipulation}
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.28;z-index:0;animation:drift 14s ease-in-out infinite alternate}
.o1{width:300px;height:300px;background:#7b3cff;left:-80px;top:10%}
.o2{width:260px;height:260px;background:#ff3c8e;right:-70px;top:45%;animation-delay:-5s}
.o3{width:240px;height:240px;background:#1fc6ff;left:30%;bottom:-90px;animation-delay:-9s}
@keyframes drift{to{transform:translate(40px,-50px) scale(1.2)}}
main{position:relative;z-index:1;width:min(94vw,480px)}
h1{margin:0 0 10px;text-align:center;font-size:34px;letter-spacing:1px;background:linear-gradient(90deg,#ffd34d,#ff5d9e,#6ad4ff,#ffd34d);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite}
@keyframes sh{to{background-position:300% 0}}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.st{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:6px 4px;text-align:center;}
.st small{display:block;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut)}
.st b{font-size:20px}
#pg{height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;margin-bottom:12px}
#bar{height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,#ff5d9e,#ffd34d);box-shadow:0 0 12px #ffd34d;transition:width .4s}
#wrap{position:relative;padding:8px;border-radius:20px;background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.18);box-shadow:0 20px 60px rgba(0,0,0,.55),0 0 40px rgba(123,60,255,.35)}
#board{position:relative;margin:0 auto;width:min(94vw,464px);aspect-ratio:1;border-radius:14px;touch-action:none;background:repeating-conic-gradient(rgba(255,255,255,.05) 0 25%,rgba(255,255,255,0) 0 50%) 0 0/25% 25%,rgba(8,5,30,.7)}
.tile{position:absolute;left:0;top:0;width:var(--cs,48px);height:var(--cs,48px);transition:transform .35s cubic-bezier(.3,1.3,.5,1);filter:drop-shadow(0 3px 1px rgba(0,0,0,.55));cursor:pointer}
.g{position:absolute;left:10%;top:10%;right:10%;bottom:10%;background:conic-gradient(#fff4 0 12.5%,#0002 0 25%,#fff3 0 37.5%,#0003 0 50%,#fff4 0 62.5%,#0002 0 75%,#fff3 0 87.5%,#0003 0),linear-gradient(150deg,var(--a),var(--b))}
.g.rim{left:6%;top:6%;right:6%;bottom:6%;background:linear-gradient(150deg,#fff,var(--a) 55%,var(--b))}
.g:not(.rim)::before{content:"";position:absolute;left:24%;top:24%;right:24%;bottom:24%;clip-path:inherit;background:linear-gradient(145deg,rgba(255,255,255,.65),rgba(255,255,255,.05) 70%)}
.g:not(.rim)::after{content:"";position:absolute;left:0;top:0;right:0;bottom:0;background:radial-gradient(ellipse 14% 9% at 30% 24%,#fff 0 60%,rgba(255,255,255,0) 100%),linear-gradient(210deg,rgba(255,255,255,.25),rgba(255,255,255,0) 40%,rgba(0,0,0,.25))}
.tile.sel .g{animation:pul .5s ease-in-out infinite alternate}
@keyframes pul{from{transform:scale(1)}to{transform:scale(1.22) rotate(6deg)}}
#fx{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:3}
.sp{position:absolute;width:8px;height:8px;border-radius:50%;margin:-4px 0 0 -4px}
.pt{position:absolute;font-weight:800;font-size:22px;color:#fff;text-shadow:0 0 10px var(--ac),0 2px 4px #000;transform:translate(-50%,-50%)}
#combo{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:34px;font-weight:900;color:var(--ac);text-shadow:0 0 20px #ff5d9e,0 3px 6px #000;opacity:0;pointer-events:none;z-index:4;white-space:nowrap}
#ov{position:absolute;left:0;top:0;right:0;bottom:0;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:rgba(8,5,30,.82);backdrop-filter:blur(5px);border-radius:20px}
#ov.on{display:flex;animation:pop .4s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{from{opacity:0;transform:scale(.8)}}
#ov h2{margin:0;font-size:30px;color:var(--ac)}
#ov p{margin:0;color:var(--mut)}
button{font:inherit;font-weight:800;font-size:17px;color:#2a1200;background:linear-gradient(180deg,#ffe27a,#ffa928);border:0;border-radius:14px;padding:12px 28px;box-shadow:0 6px 0 #b86a00,0 10px 20px rgba(0,0,0,.4);cursor:pointer}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #b86a00}
.tip{text-align:center;color:var(--mut);font-size:12px;margin-top:12px}
.mk{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--cs)*.4);color:#fff;text-shadow:0 0 5px #000,0 0 2px #000;pointer-events:none;z-index:2;animation:mk 1s ease-in-out infinite alternate}
@keyframes mk{to{transform:scale(1.18)}}
.tile.sp1,.tile.sp3{filter:drop-shadow(0 0 7px #fff) drop-shadow(0 3px 1px rgba(0,0,0,.55))}
.tile.hint .g{animation:pul .35s ease-in-out infinite alternate}
.ctl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.ib{font-size:14px;padding:9px 14px;border-radius:12px;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);box-shadow:none}
.ib:active{transform:scale(.95);box-shadow:none}
.bk{display:inline-block;margin-bottom:6px;color:var(--mut);font-size:13px;text-decoration:none}
.bk:hover{color:#fff}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<main>
<a class="bk" href="https://cybernovaworks.store/store.html">← CyberNovaWorks Store</a>
<h1>💎 GEM RUSH</h1>
<div class="hud">
<div class="st"><small>Score</small><b id="sc">0</b></div>
<div class="st"><small>Moves</small><b id="mv">20</b></div>
<div class="st"><small>Level</small><b id="lv">1</b></div>
<div class="st"><small>Best</small><b id="bs">0</b></div>
</div>
<div id="pg"><div id="bar"></div></div>
<div id="wrap">
<div id="board"><div id="fx"></div></div>
<div id="combo"></div>
<div id="ov"><h2 id="ot"></h2><p id="od"></p><button id="ob">Play</button><button class="ib share">📲 Share on WhatsApp</button></div>
</div>
<div class="ctl"><button class="ib" id="hb">💡 Hint</button><button class="ib share">📲 Share</button><button class="ib" id="mu">🎵 Music</button><button class="ib" id="mt">🔊 Effects</button></div>
<p class="tip">Match 4 for a ⚡ line-blast gem · Match 5 for a ✦ rainbow gem (swap it with any colour)</p>
</main>
<script>
const N=8,COL=[['#ff4d6a','#b0002a'],['#3aa8ff','#0b43c4'],['#2fe69a','#067a4a'],['#ffd34d','#e08a00'],['#b866ff','#5b1fd0'],['#ff9a4d','#d9480f']];
const SH=['circle(48%)','polygon(50% 0,100% 50%,50% 100%,0 50%)','polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)','polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)','polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)','polygon(50% 4%,96% 92%,4% 92%)'];
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const board=$('#board'),fx=$('#fx'),rnd=()=>Math.random()*6|0;
let grid,score=0,moves=20,level=1,lvStart=0,busy=true,sel=null,start=null,best=0;
try{best=+localStorage.getItem('gr_best')||0}catch(e){}
const goal=()=>500+level*250;
function hud(){
  $('#sc').textContent=score;$('#mv').textContent=moves;$('#lv').textContent=level;
  if(score>best){best=score;try{localStorage.setItem('gr_best',best)}catch(e){}}
  $('#bs').textContent=best;
  $('#bar').style.width=Math.min(100,(score-lvStart)/goal()*100)+'%';
}
let cell=48;
const tr=(c,r)=>'translate('+c*cell+'px,'+r*cell+'px)';
const place=o=>{o.el.style.transform=tr(o.c,o.r)};
function fit(){
  cell=Math.max(30,Math.floor((Math.min(innerWidth*.94,480)-16)/N));
  board.style.width=cell*N+'px';board.style.setProperty('--cs',cell+'px');
  if(grid)for(const row of grid)for(const o of row)if(o){o.el.style.transition='none';place(o);void o.el.offsetWidth;o.el.style.transition=''}
}
addEventListener('resize',fit);
function mk(t,r,c,from){
  const el=document.createElement('div');el.className='tile';el.style.setProperty('--c',COL[t][0]);
  const css='--a:'+COL[t][0]+';--b:'+COL[t][1]+';clip-path:'+SH[t];
  const rim=document.createElement('i');rim.className='g rim';rim.style.cssText=css;
  const g=document.createElement('i');g.className='g';g.style.cssText=css;
  el.appendChild(rim);el.appendChild(g);board.appendChild(el);
  const o={t,el,r,c};
  if(from!==undefined){el.style.transition='none';el.style.transform=tr(c,from);void el.offsetWidth;el.style.transition=''}
  place(o);grid[r][c]=o;return o;
}
async function newBoard(sv){
  busy=true;board.querySelectorAll('.tile').forEach(e=>e.remove());
  grid=Array.from({length:N},()=>Array(N).fill(null));
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    let o;
    if(sv){const [t,sp]=sv.g[r][c];o=mk(t===6?rnd():t,r,c,-N-1);if(sp)setSpecial(o,sp)}
    else{
      let t;do{t=rnd()}while((c>1&&grid[r][c-1].t===t&&grid[r][c-2].t===t)||(r>1&&grid[r-1][c].t===t&&grid[r-2][c].t===t));
      o=mk(t,r,c,-N-1);
    }
    o.el.style.transitionDelay=(c*45+(N-r)*35)+'ms';
  }
  await sleep(1100);board.querySelectorAll('.tile').forEach(e=>e.style.transitionDelay='');
  hud();if(!hint())await shuffle();save();busy=false;
}
function find(){
  const s=new Set,runs=[];
  const scan=get=>{for(let i=0;i<N;i++){let j=0;while(j<N){
    const a=get(i,j);let k=j+1;
    while(a&&a.t<6&&k<N&&get(i,k).t===a.t)k++;
    if(a&&a.t<6&&k-j>=3){const run=[];for(let x=j;x<k;x++)run.push(get(i,x));run.forEach(o=>s.add(o));runs.push(run)}
    j=k}}};
  scan((i,j)=>grid[i][j]);scan((i,j)=>grid[j][i]);
  s.runs=runs;return s;
}
function swapT(a,b){[a.r,b.r]=[b.r,a.r];[a.c,b.c]=[b.c,a.c];grid[a.r][a.c]=a;grid[b.r][b.c]=b;place(a);place(b)}
function spark(x,y,col,n){
  for(let i=0;i<n;i++){
    const d=document.createElement('b');d.className='sp';d.style.cssText='left:'+x+'%;top:'+y+'%;background:'+col+';box-shadow:0 0 8px '+col;
    fx.appendChild(d);
    const a=Math.random()*6.28,k=35+Math.random()*60;
    d.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate('+Math.cos(a)*k+'px,'+Math.sin(a)*k+'px) scale(0)',opacity:0}],{duration:500+Math.random()*300,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>d.remove();
  }
}
function say(txt,x,y){
  const d=document.createElement('div');d.className='pt';d.textContent=txt;d.style.cssText='left:'+x+'%;top:'+y+'%';fx.appendChild(d);
  d.animate([{opacity:1,transform:'translate(-50%,-50%) scale(.6)'},{opacity:1,transform:'translate(-50%,-110%) scale(1.2)',offset:.3},{opacity:0,transform:'translate(-50%,-260%) scale(1)'}],{duration:900}).onfinish=()=>d.remove();
}
function combo(k){
  const e=$('#combo');e.textContent='Combo x'+k+'!';
  e.animate([{opacity:0,transform:'translate(-50%,-50%) scale(.4) rotate(-8deg)'},{opacity:1,transform:'translate(-50%,-50%) scale(1.15) rotate(3deg)',offset:.35},{opacity:0,transform:'translate(-50%,-90%) scale(1)'}],{duration:950});
}
async function clear(m,k){
  const keep=new Set,ls=k===1?LS:[];
  (m.runs||[]).forEach(run=>{
    if(run.length<4)return;
    const o=run.find(x=>ls.includes(x))||run[run.length>>1];
    if(o.sp)return;
    keep.add(o);setSpecial(o,run.length>=5?3:1);spark((o.c+.5)/N*100,(o.r+.5)/N*100,'#fff',14);
  });
  keep.forEach(o=>m.delete(o));if(keep.size)sSparkle();
  const q=[...m],add=x=>{if(x&&!m.has(x)&&!keep.has(x)){m.add(x);q.push(x)}};
  for(const o of q){
    if(o.sp===1)for(let i=0;i<N;i++){add(grid[o.r][i]);add(grid[i][o.c])}
    if(o.sp===3){const t=rnd();grid.forEach(r=>r.forEach(x=>{if(x&&x.t===t)add(x)}))}
  }
  const n=m.size,sp=q.some(o=>o.sp),gain=n*10*k+(n>3?(n-3)*20:0)+(sp?100:0);let cx=0,cy=0;
  score+=gain;
  m.forEach(o=>{
    const x=(o.c+.5)/N*100,y=(o.r+.5)/N*100;cx+=x;cy+=y;
    spark(x,y,o.t<6?COL[o.t][0]:'#fff',8);
    o.el.querySelectorAll('.g,.mk').forEach(g=>g.animate([{transform:'scale(1)',opacity:1},{transform:'scale(1.4) rotate(20deg)',opacity:1,offset:.3},{transform:'scale(0) rotate(90deg)',opacity:0}],{duration:320,fill:'forwards'}));
    setTimeout(()=>o.el.remove(),330);grid[o.r][o.c]=null;
  });
  if(n>=6||sp)shake();
  sPop(k);if(sp)sZap();vib(sp?40:10);
  say('+'+gain,cx/n,cy/n);if(k>1)combo(k);
  hud();await sleep(340);
}
async function drop(){
  for(let c=0;c<N;c++){
    let w=N-1;
    for(let r=N-1;r>=0;r--){const o=grid[r][c];if(o){if(r!==w){grid[w][c]=o;grid[r][c]=null;o.r=w;place(o)}w--}}
    for(let r=w,i=1;r>=0;r--,i++)mk(rnd(),r,c,-i);
  }
  await sleep(420);
}
async function tryMove(a,b){
  if(busy||!b)return;busy=true;unsel();LS=[a,b];sSwap();
  swapT(a,b);await sleep(260);
  let m;
  if(a.sp===3||b.sp===3){
    const R=a.sp===3?a:b,O=R===a?b:a;m=new Set([R]);
    grid.forEach(r=>r.forEach(x=>{if(x&&(O.sp===3||x.t===O.t))m.add(x)}));
    R.sp=0;
  }else m=find();
  if(!m.size){sBad();swapT(a,b);await sleep(260);busy=false;return}
  moves--;hud();let k=1;
  while(m.size){await clear(m,k++);await drop();m=find()}
  if(score-lvStart>=goal()){
    sWin();vib([60,40,60,40,120]);
    for(let i=0;i<6;i++)setTimeout(()=>spark(Math.random()*100,Math.random()*100,COL[rnd()][0],14),i*120);
    over('Level '+level+' clear! 🎉','Great job! Next goal: '+(500+(level+1)*250)+' points','Next level',()=>{level++;moves=20;lvStart=score;newBoard()});
  }else if(moves<=0){
    sLose();try{localStorage.removeItem('gr_save')}catch(e){}
    over('Game over','Final score: '+score+'  ·  Best: '+best,'Play again',()=>{level=1;score=0;moves=20;lvStart=0;newBoard()});
  }else{if(!hint())await shuffle();save();busy=false}
}
function over(t,d,b,fn){
  $('#ot').textContent=t;$('#od').textContent=d;$('#ob').textContent=b;$('#ov').classList.add('on');
  $('#ob').onclick=()=>{$('#ov').classList.remove('on');fn()};
}
function unsel(){if(sel)sel.el.classList.remove('sel');sel=null}
function pick(o){
  if(sel===o){unsel();return}
  if(sel&&Math.abs(sel.r-o.r)+Math.abs(sel.c-o.c)===1){const a=sel;tryMove(a,o);return}
  unsel();sel=o;o.el.classList.add('sel');
}
const at=el=>{for(const row of grid)for(const o of row)if(o&&o.el===el)return o};
board.addEventListener('pointerdown',e=>{
  if(busy)return;const t=e.target.closest('.tile');if(!t)return;
  start={o:at(t),x:e.clientX,y:e.clientY};
});
board.addEventListener('pointermove',e=>{
  if(!start||busy)return;
  const dx=e.clientX-start.x,dy=e.clientY-start.y;
  if(Math.hypot(dx,dy)<22)return;
  const o=start.o;start=null;
  const h=Math.abs(dx)>Math.abs(dy),nr=o.r+(h?0:Math.sign(dy)),nc=o.c+(h?Math.sign(dx):0);
  if(nr>=0&&nr<N&&nc>=0&&nc<N)tryMove(o,grid[nr][nc]);
});
board.addEventListener('pointerup',()=>{if(start&&!busy){const o=start.o;start=null;pick(o)}start=null});
board.addEventListener('pointercancel',()=>{start=null});
let LS=[],AC,muted=false;
try{muted=localStorage.getItem('gr_mute')==='1'}catch(e){}
function ctx(){AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function snd(f,d,type,v,w){
  if(muted)return;
  try{ctx();
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(w||0);
    o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);}catch(e){}
}
const PE=[523,587,659,784,880,1047,1175,1319,1568];
const sPop=k=>snd(PE[Math.min(k-1,8)],.2,'triangle',.18),sSwap=()=>snd(320,.08,'sine',.1),sBad=()=>snd(150,.15,'square',.06);
const sWin=()=>{duck();[523,659,784,1047,1319,1568].forEach((f,i)=>snd(f,.45,'triangle',.18,i*.11))},sLose=()=>{duck();[392,330,262].forEach((f,i)=>snd(f,.35,'sawtooth',.07,i*.15))};
function sweep(a,b,d,type,v){
  if(muted)return;
  try{ctx();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.type=type;o.frequency.setValueAtTime(a,t);o.frequency.exponentialRampToValueAtTime(b,t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}
}
const sSparkle=()=>[1047,1319,1568,2093].forEach((f,i)=>snd(f,.22,'sine',.12,i*.05)),sZap=()=>sweep(1400,180,.35,'sawtooth',.07),sShuf=()=>sweep(300,1000,.4,'triangle',.1),sTick=()=>snd(880,.08,'sine',.1);
const vib=p=>{if(!muted)try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
function setSpecial(o,sp){
  o.sp=sp;
  if(sp===3){o.t=6;o.el.querySelectorAll('.g').forEach(x=>{x.style.background='conic-gradient(#ff4d6a,#ffd34d,#2fe69a,#3aa8ff,#b866ff,#ff4d6a)';x.style.clipPath=SH[0]})}
  const m=document.createElement('span');m.className='mk';m.textContent=sp===3?'✦':'⚡';
  o.el.appendChild(m);o.el.classList.add('sp'+sp);
}
const shake=()=>board.animate([{transform:'translate(0,0)'},{transform:'translate(-5px,3px)'},{transform:'translate(5px,-3px)'},{transform:'translate(-3px,-2px)'},{transform:'translate(0,0)'}],{duration:320});
function m3(T){for(let r=0;r<N;r++)for(let c=0;c<N;c++){const t=T[r][c];if(t<6&&((c<N-2&&T[r][c+1]===t&&T[r][c+2]===t)||(r<N-2&&T[r+1][c]===t&&T[r+2][c]===t)))return 1}return 0}
function hint(){
  const T=grid.map(r=>r.map(o=>o.t));
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(const [dr,dc] of [[0,1],[1,0]]){
    const r2=r+dr,c2=c+dc;if(r2>=N||c2>=N)continue;
    if(grid[r][c].sp===3||grid[r2][c2].sp===3)return [grid[r][c],grid[r2][c2]];
    [T[r][c],T[r2][c2]]=[T[r2][c2],T[r][c]];const ok=m3(T);[T[r][c],T[r2][c2]]=[T[r2][c2],T[r][c]];
    if(ok)return [grid[r][c],grid[r2][c2]];
  }
  return null;
}
async function shuffle(){
  sShuf();const e=$('#combo');e.textContent='No moves — shuffling!';
  e.animate([{opacity:0},{opacity:1,offset:.2},{opacity:1,offset:.8},{opacity:0}],{duration:1100});
  await sleep(500);
  const all=grid.flat();
  for(let n=0;n<40;n++){
    for(let i=all.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[all[i],all[j]]=[all[j],all[i]]}
    all.forEach((o,i)=>{o.r=i/N|0;o.c=i%N;grid[o.r][o.c]=o});
    if(!find().size&&hint())break;
  }
  all.forEach(place);await sleep(500);
}
function save(){try{localStorage.setItem('gr_save',JSON.stringify({level,score,moves,lvStart,g:grid.map(r=>r.map(o=>[o.t,o.sp||0]))}))}catch(e){}}
const SHARE_URL='https://cybernovaworks.store/games/gem-rush.html';

  const txt='💎 Maine Gem Rush mein Level '+level+' par '+score+' score kiya! Kya tum isse zyada kar sakte ho? Khel ke dekho: '+(SHARE_URL||location.href);

$('#hb').onclick=()=>{if(busy)return;sTick();const h=hint();if(h)h.forEach(o=>{o.el.classList.add('hint');setTimeout(()=>o.el.classList.remove('hint'),1800)})};
const mt=$('#mt'),mtl=()=>{mt.textContent=muted?'🔇 Effects off':'🔊 Effects'};mtl();
mt.onclick=()=>{muted=!muted;try{localStorage.setItem('gr_mute',muted?'1':'0')}catch(e){}mtl();snd(660,.12,'triangle',.15)};
let musicOn=true,mg,mTimer=0,mStep=0,nextT=0,NB;
try{musicOn=localStorage.getItem('gr_music')!=='0'}catch(e){}
const TR=[{bpm:108,ch:[[60,64,67],[65,69,72],[67,71,74],[57,60,64]]},
 {bpm:92,ch:[[57,60,64],[53,57,60],[60,64,67],[55,59,62]]},
 {bpm:120,ch:[[62,65,69],[58,62,65],[65,69,72],[60,64,67]]}],ARP=[0,1,2,3,2,1,2,1];
function mn(n,t,d,type,v,at){
  const o=AC.createOscillator(),g=AC.createGain();at=at||.01;
  o.type=type;o.frequency.value=440*Math.pow(2,(n-69)/12);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+at);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.05);
}
function hat(t){
  if(!NB){NB=AC.createBuffer(1,AC.sampleRate*.05|0,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length)}
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  f.type='highpass';f.frequency.value=7000;g.gain.value=.35;s.buffer=NB;s.connect(f);f.connect(g);g.connect(mg);s.start(t);
}
function mTick(){
  if(!AC||!musicOn||AC.state!=='running')return;
  const T=TR[(level-1)%3],sd=30/T.bpm;
  if(nextT<AC.currentTime)nextT=AC.currentTime+.05;
  while(nextT<AC.currentTime+.4){
    const b=mStep&7,ch=T.ch[(mStep>>3)&3],a=ARP[b];
    mn(ch[a%3]+(a>2?24:12),nextT,sd*1.7,'triangle',.5);
    if(b===0){ch.forEach(n=>mn(n,nextT,sd*8,'sine',.22,.5))}
    if(b===0||b===4)mn(ch[0]-12,nextT,sd*3,'sine',.9);
    if(b&1)hat(nextT);
    nextT+=sd;mStep++;
  }
}
function startMusic(){
  if(!musicOn||mTimer)return;
  ctx();if(!mg){mg=AC.createGain();mg.gain.value=.12;mg.connect(AC.destination)}
  mTimer=setInterval(mTick,100);
}
function stopMusic(){clearInterval(mTimer);mTimer=0}
function duck(){if(!mg)return;const t=AC.currentTime;mg.gain.setTargetAtTime(.03,t,.05);mg.gain.setTargetAtTime(.12,t+2.2,.4)}
addEventListener('pointerdown',()=>{if(musicOn)startMusic()});
document.addEventListener('visibilitychange',()=>{if(AC)document.hidden?AC.suspend():AC.resume()});
const mu=$('#mu'),mul=()=>{mu.textContent=musicOn?'🎵 Music':'🎵 Off'};mul();
mu.onclick=()=>{musicOn=!musicOn;try{localStorage.setItem('gr_music',musicOn?'1':'0')}catch(e){}mul();musicOn?startMusic():stopMusic()};
let sv=null;try{sv=JSON.parse(localStorage.getItem('gr_save'))}catch(e){}
if(sv&&sv.g&&sv.moves>0){level=sv.level;score=sv.score;moves=sv.moves;lvStart=sv.lvStart}else sv=null;
fit();hud();newBoard(sv);
