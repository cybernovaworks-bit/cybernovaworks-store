<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter name="glow" id="glowFx" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="900" height="300" fill="#0A0E12"/>

  <!-- Mark: chip / circuit hexagon -->
  <g transform="translate(150,150)">
    <!-- pins -->
    <g stroke="url(#chipGrad)" stroke-width="4" stroke-linecap="round">
      <line x1="-70" y1="-25" x2="-92" y2="-25"/>
      <line x1="-70" y1="0" x2="-92" y2="0"/>
      <line x1="-70" y1="25" x2="-92" y2="25"/>
      <line x1="70" y1="-25" x2="92" y2="-25"/>
      <line x1="70" y1="0" x2="92" y2="0"/>
      <line x1="70" y1="25" x2="92" y2="25"/>
      <line x1="-25" y1="-70" x2="-25" y2="-92"/>
      <line x1="25" y1="-70" x2="25" y2="-92"/>
      <line x1="-25" y1="70" x2="-25" y2="92"/>
      <line x1="25" y1="70" x2="25" y2="92"/>
    </g>

    <!-- chip body -->
    <rect x="-70" y="-70" width="140" height="140" rx="18" fill="#0F1A1E" stroke="url(#chipGrad)" stroke-width="3"/>

    <!-- inner N mark -->
    <path d="M -26,26 L -26,-26 L 26,26 L 26,-26"
          fill="none" stroke="url(#chipGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="270" y="136" font-family="'Trebuchet MS', Arial, sans-serif" font-weight="700" font-size="50" fill="#F1F5F4" letter-spacing="0.5">CyberNovaWorks</text>

  <!-- Tagline -->
  <text x="271" y="172" font-family="'Trebuchet MS', Arial, sans-serif" font-weight="400" font-size="17" fill="#10B981" letter-spacing="3">BUILD &#8226; DEPLOY &#8226; SCALE</text>
</svg>
