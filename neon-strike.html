<!DOCTYPE html>
<html lang="en">
<head>

        iframe { height: 100%; width: 100%; border: none; background: #04051a; display: block; border-radius: 8px; }
        @media (max-width: 1100px) { .ad-slot { display: none; } }
    </style>
    <script src="ads.js"></script>
</head>
<body>

        <div class="ad-slot">
